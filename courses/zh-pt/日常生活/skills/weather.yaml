Phrases:
  - Phrase: Hoje está ensolarado.
    Translation: 今天天气晴朗。
  - Phrase: Vai chover.
    Translation: 要下雨了。
  - Phrase: Está muito frio lá fora.
    Translation: 外面很冷。
  - Phrase: Leve um guarda-chuva.
    Translation: 带上雨伞。
  - Phrase: Qual é a temperatura?
    Translation: 多少度？
  - Phrase: Está nevando.
    Translation: 下雪了。
  - Phrase: Hoje está ameno.
    Translation: 今天很暖和。
  - Phrase: Está ventando.
    Translation: 刮风了。

