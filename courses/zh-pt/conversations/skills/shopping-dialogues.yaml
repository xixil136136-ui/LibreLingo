New words:
  - Word: Quanto
    Translation: 多少钱
  - Word: o desconto
    Translation: 折扣
  - Word: o cartão de crédito
    Translation: 信用卡
  - Word: o dinheiro
    Translation: 现金
  - Word: o tamanho
    Translation: 尺寸
  - Word: a cor
    Translation: 颜色
  - Word: experimentar
    Translation: 试穿
  - Word: o recibo
    Translation: 收据
  - Word: muito caro
    Translation: 太贵
  - Word: trocar
    Translation: 换货

Phrases:
  - Phrase: Quanto custa isto?
    Translation: 这个多少钱？
  - Phrase: Posso experimentar?
    Translation: 我能试穿这个吗？
  - Phrase: Tem em outra cor?
    Translation: 有别的颜色吗？
  - Phrase: Está muito caro. Tem desconto?
    Translation: 太贵了。有折扣吗？
  - Phrase: Vou levar. Posso pagar com cartão?
    Translation: 我买了。能用卡支付吗？
  - Phrase: O recibo, por favor.
    Translation: 请给我收据。
  - Phrase: Gostaria de trocar isto.
    Translation: 我想换这个。
  - Phrase: Tem um tamanho menor?
    Translation: 有小一点的尺寸吗？
  - Phrase: Tem liquidação?
    Translation: 有打折活动吗？
  - Phrase: Só estou olhando, obrigado.
    Translation: 我就看看，谢谢。

