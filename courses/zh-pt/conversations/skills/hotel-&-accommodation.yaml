Phrases:
  - Phrase: Tenho uma reserva.
    Translation: 我有预订。
  - Phrase: Gostaria de fazer check-in, por favor.
    Translation: 我想办理入住。
  - Phrase: Quanto custa um quarto duplo por noite?
    Translation: 双人间一晚多少钱？
  - Phrase: O café da manhã está incluído?
    Translation: 包含早餐吗？
  - Phrase: Qual é a senha do WiFi?
    Translation: WiFi密码是什么？
  - Phrase: O ar condicionado não está funcionando.
    Translation: 空调坏了。
  - Phrase: Pode me dar um despertador às 7h?
    Translation: 能给我设置早上7点的叫醒服务吗？
  - Phrase: Gostaria de fazer check-out, por favor.
    Translation: 我想退房。
  - Phrase: Posso deixar minha bagagem aqui?
    Translation: 我能寄存行李吗？
  - Phrase: Obrigado por uma estadia maravilhosa!
    Translation: 谢谢，住得很愉快！

