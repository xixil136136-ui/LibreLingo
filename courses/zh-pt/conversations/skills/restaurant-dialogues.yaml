New words:
  - Word: Eu gostaria de
    Translation: 我想要
  - Word: o cardápio
    Translation: 菜单
  - Word: pedir
    Translation: 点餐
  - Word: a conta
    Translation: 账单
  - Word: delicioso
    Translation: 美味
  - Word: a recomendação
    Translation: 推荐
  - Word: a reserva
    Translation: 预约
