Phrases:
  - Phrase: Gostaria de fazer uma reserva.
    Translation: 我想预约。
  - Phrase: Uma mesa para dois, por favor.
    Translation: 请给我一个两人桌。
  - Phrase: Posso ver o cardápio?
    Translation: 我能看看菜单吗？
  - Phrase: O que você recomenda?
    Translation: 你推荐什么？
  - Phrase: Vou querer o bife, por favor.
    Translation: 我要牛排。
  - Phrase: A conta, por favor.
    Translation: 请给我账单。
  - Phrase: A comida está deliciosa!
    Translation: 食物太好吃了！
  - Phrase: Pode me dar um pouco de água?
    Translation: 能给我一些水吗？
  - Phrase: O serviço está incluído?
    Translation: 服务费包含在内吗？
  - Phrase: Sou alérgico a amendoim.
    Translation: 我对花生过敏。

