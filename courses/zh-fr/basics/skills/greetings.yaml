Phrases:
  - Phrase: Bonjour, comment allez-vous ?
    Translation: 你好，您好吗？
  - Phrase: Merci beaucoup.
    Translation: 非常感谢。
  - Phrase: Au revoir, à demain.
    Translation: 再见，明天见。
  - Phrase: Pardon, je suis en retard.
    Translation: 对不起，我迟到了。
  - Phrase: De rien, bonne journée !
    Translation: 不客气，祝好！

