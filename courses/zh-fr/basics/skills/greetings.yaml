New words:
  - Word: bonjour
    Translation: 你好/早上好
  - Word: bonsoir
    Translation: 晚上好
  - Word: au revoir
    Translation: 再见
  - Word: merci
    Translation: 谢谢
  - Word: s'il vous plaît
    Translation: 请
  - Word: pardon
    Translation: 对不起
  - Word: oui
    Translation: 是的
  - Word: non
    Translation: 不是
