Phrases:
  - Phrase: Tournez à gauche ici.
    Translation: 在这里左转。
  - Phrase: Allez tout droit.
    Translation: 一直往前走。
  - Phrase: Où est la gare ?
    Translation: 车站在哪里？
  - Phrase: Est-ce loin d'ici ?
    Translation: 离这里远吗？
  - Phrase: J'ai besoin d'une carte.
    Translation: 我需要一张地图。

