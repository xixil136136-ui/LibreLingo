Phrases:
  - Phrase: Il fait beau aujourd'hui.
    Translation: 今天天气晴朗。
  - Phrase: Il va pleuvoir.
    Translation: 要下雨了。
  - Phrase: Il fait très froid dehors.
    Translation: 外面很冷。
  - Phrase: Prends un parapluie.
    Translation: 带上雨伞。
  - Phrase: Quelle est la température ?
    Translation: 多少度？
  - Phrase: Il neige.
    Translation: 下雪了。
  - Phrase: Il fait doux aujourd'hui.
    Translation: 今天很暖和。
  - Phrase: Il y a du vent.
    Translation: 刮风了。

