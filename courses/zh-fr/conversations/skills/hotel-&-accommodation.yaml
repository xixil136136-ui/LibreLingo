Phrases:
  - Phrase: I have a reservation.
    Translation: 我有预订。
  - Phrase: I'd like to check in, please.
    Translation: 我想办理入住。
  - Phrase: How much is a double room per night?
    Translation: 双人间一晚多少钱？
  - Phrase: Is breakfast included?
    Translation: 包含早餐吗？
  - Phrase: What's the WiFi password?
    Translation: WiFi密码是什么？
  - Phrase: The air conditioning isn't working.
    Translation: 空调坏了。
  - Phrase: Can I have a wake-up call at 7am?
    Translation: 能给我设置早上7点的叫醒服务吗？
  - Phrase: I'd like to check out, please.
    Translation: 我想退房。
  - Phrase: Can I store my luggage here?
    Translation: 我能寄存行李吗？
  - Phrase: Thank you for a wonderful stay!
    Translation: 谢谢，住得很愉快！

