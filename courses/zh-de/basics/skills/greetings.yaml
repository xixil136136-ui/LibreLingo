New words:
  - Word: Hallo
    Translation: 你好
  - Word: Tschüss
    Translation: 再见
  - Word: Guten Morgen
    Translation: 早上好
  - Word: Guten Abend
    Translation: 晚上好
  - Word: Danke
    Translation: 谢谢
  - Word: Bitte
    Translation: 请/不客气
  - Word: Entschuldigung
    Translation: 对不起
  - Word: Ja
    Translation: 是的
  - Word: Nein
    Translation: 不是
  - Word: Wie geht's
    Translation: 你好吗

Phrases:
  - Phrase: Hallo, wie geht's?
    Translation: 你好，你好吗？
  - Phrase: Guten Morgen, danke.
    Translation: 早上好，谢谢。
  - Phrase: Tschüss, bis später.
    Translation: 再见，回头见。
  - Phrase: Danke schön!
    Translation: 非常感谢！
  - Phrase: Entschuldigung, wo ist der Bahnhof?
    Translation: 对不起，车站在哪里？

