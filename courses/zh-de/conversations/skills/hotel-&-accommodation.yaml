Phrases:
  - Phrase: Ich habe eine Reservierung.
    Translation: 我有预订。
  - Phrase: Ich möchte bitte einchecken.
    Translation: 我想办理入住。
  - Phrase: Was kostet ein Doppelzimmer pro Nacht?
    Translation: 双人间一晚多少钱？
  - Phrase: Ist Frühstück inkludiert?
    Translation: 包含早餐吗？
  - Phrase: Wie ist das WLAN-Passwort?
    Translation: WiFi密码是什么？
  - Phrase: Die Klimaanlage funktioniert nicht.
    Translation: 空调坏了。
  - Phrase: Kann ich bitte einen Weckruf um 7 Uhr haben?
    Translation: 能给我设置早上7点的叫醒服务吗？
  - Phrase: Ich möchte bitte auschecken.
    Translation: 我想退房。
  - Phrase: Kann ich mein Gepäck hier lassen?
    Translation: 我能寄存行李吗？
  - Phrase: Vielen Dank für einen wundervollen Aufenthalt!
    Translation: 谢谢，住得很愉快！

