Phrases:
  - Phrase: Ich möchte eine Reservierung vornehmen.
    Translation: 我想预约。
  - Phrase: Einen Tisch für zwei, bitte.
    Translation: 请给我一个两人桌。
  - Phrase: Kann ich die Speisekarte sehen?
    Translation: 我能看看菜单吗？
  - Phrase: Was empfehlen Sie?
    Translation: 你推荐什么？
  - Phrase: Ich nehme das Steak.
    Translation: 我要牛排。
  - Phrase: Kann ich bitte die Rechnung haben?
    Translation: 请给我账单。
  - Phrase: Das Essen ist köstlich!
    Translation: 食物太好吃了！
  - Phrase: Kann ich etwas Wasser haben?
    Translation: 能给我一些水吗？
  - Phrase: Ist die Bedienung inklusive?
    Translation: 服务费包含在内吗？
  - Phrase: Ich bin allergisch gegen Erdnüsse.
    Translation: 我对花生过敏。

