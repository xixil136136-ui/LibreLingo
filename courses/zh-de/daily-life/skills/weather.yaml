Phrases:
  - Phrase: Heute ist es sonnig.
    Translation: 今天天气晴朗。
  - Phrase: Es wird regnen.
    Translation: 要下雨了。
  - Phrase: Es ist sehr kalt draußen.
    Translation: 外面很冷。
  - Phrase: Bring einen Regenschirm mit.
    Translation: 带上雨伞。
  - Phrase: Wie ist die Temperatur?
    Translation: 多少度？
  - Phrase: Es schneit.
    Translation: 下雪了。
  - Phrase: Heute ist es warm.
    Translation: 今天很暖和。
  - Phrase: Es ist windig.
    Translation: 刮风了。

