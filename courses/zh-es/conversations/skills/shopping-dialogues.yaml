New words:
  - Word: Cuánto
    Translation: 多少钱
  - Word: el descuento
    Translation: 折扣
  - Word: la tarjeta de crédito
    Translation: 信用卡
  - Word: el efectivo
    Translation: 现金
  - Word: la talla
    Translation: 尺寸
  - Word: el color
    Translation: 颜色
  - Word: probarse
    Translation: 试穿
  - Word: el recibo
    Translation: 收据
  - Word: demasiado caro
    Translation: 太贵
  - Word: cambiar
    Translation: 换货

Phrases:
  - Phrase: ¿Cuánto cuesta esto?
    Translation: 这个多少钱？
  - Phrase: ¿Puedo probármelo?
    Translation: 我能试穿这个吗？
  - Phrase: ¿Lo tiene en otro color?
    Translation: 有别的颜色吗？
  - Phrase: Es demasiado caro. ¿Hay descuento?
    Translation: 太贵了。有折扣吗？
  - Phrase: Me lo llevo. ¿Puedo pagar con tarjeta?
    Translation: 我买了。能用卡支付吗？
  - Phrase: ¿Me da un recibo, por favor?
    Translation: 请给我收据。
  - Phrase: Quisiera cambiar esto.
    Translation: 我想换这个。
  - Phrase: ¿Tiene una talla más pequeña?
    Translation: 有小一点的尺寸吗？
  - Phrase: ¿Hay rebajas?
    Translation: 有打折活动吗？
  - Phrase: Sólo estoy mirando, gracias.
    Translation: 我就看看，谢谢。

