Phrases:
  - Phrase: Tengo una reserva.
    Translation: 我有预订。
  - Phrase: Quisiera registrarme, por favor.
    Translation: 我想办理入住。
  - Phrase: ¿Cuánto cuesta una habitación doble por noche?
    Translation: 双人间一晚多少钱？
  - Phrase: ¿Está incluido el desayuno?
    Translation: 包含早餐吗？
  - Phrase: ¿Cuál es la contraseña del WiFi?
    Translation: WiFi密码是什么？
  - Phrase: El aire acondicionado no funciona.
    Translation: 空调坏了。
  - Phrase: ¿Puede darme una llamada de despertar a las 7?
    Translation: 能给我设置早上7点的叫醒服务吗？
  - Phrase: Quisiera salir, por favor.
    Translation: 我想退房。
  - Phrase: ¿Puedo dejar mi equipaje aquí?
    Translation: 我能寄存行李吗？
  - Phrase: ¡Gracias por una estancia maravillosa!
    Translation: 谢谢，住得很愉快！

