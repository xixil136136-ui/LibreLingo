Phrases:
  - Phrase: Me gustaría hacer una reserva.
    Translation: 我想预约。
  - Phrase: Una mesa para dos, por favor.
    Translation: 请给我一个两人桌。
  - Phrase: ¿Puedo ver el menú?
    Translation: 我能看看菜单吗？
  - Phrase: ¿Qué recomienda?
    Translation: 你推荐什么？
  - Phrase: Quiero el filete, por favor.
    Translation: 我要牛排。
  - Phrase: ¿Me trae la cuenta, por favor?
    Translation: 请给我账单。
  - Phrase: ¡La comida está deliciosa!
    Translation: 食物太好吃了！
  - Phrase: ¿Me puede dar un poco de agua?
    Translation: 能给我一些水吗？
  - Phrase: ¿Está incluido el servicio?
    Translation: 服务费包含在内吗？
  - Phrase: Soy alérgico al cacahuete.
    Translation: 我对花生过敏。

