Phrases:
  - Phrase: ¿Dónde está el aeropuerto?
    Translation: 机场在哪里？
  - Phrase: I need a ticket to Berlin.
    Translation: 我需要一张去柏林的票。
  - Phrase: ¿Ida o ida y vuelta?
    Translation: 单程还是往返？
  - Phrase: ¿De qué andén sale el tren?
    Translation: 火车从哪个站台出发？
  - Phrase: ¿A qué hora sale el próximo autobús?
    Translation: 下一班车几点？
  - Phrase: ¿Está ocupado este asiento?
    Translation: 这个座位有人吗？
  - Phrase: Su pasaporte, por favor.
    Translation: 请出示您的护照。
  - Phrase: No tengo nada que declarar.
    Translation: 我没有需要申报的物品。
  - Phrase: ¿Cuánto dura el viaje?
    Translation: 旅途有多久？
  - Phrase: Déjeme en la próxima parada, por favor.
    Translation: 请在下一站让我下车。

