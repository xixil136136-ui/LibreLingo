Phrases:
  - Phrase: ¿Cuánto cuesta esto?
    Translation: 这个多少钱？
  - Phrase: Es demasiado caro.
    Translation: 太贵了。
  - Phrase: Esto es de buena calidad.
    Translation: 这个质量很好。
  - Phrase: ¿La tienda está abierta?
    Translation: 商店开门吗？
  - Phrase: Está cerrado hoy.
    Translation: 今天关门了。
  - Phrase: ¿Puedo devolver esto?
    Translation: 能退货吗？
  - Phrase: La tienda está allí.
    Translation: 商店在那里。
  - Phrase: No tengo dinero.
    Translation: 我没钱。

