Phrases:
  - Phrase: Hoy hace sol.
    Translation: 今天天气晴朗。
  - Phrase: Va a llover.
    Translation: 要下雨了。
  - Phrase: Hace mucho frío afuera.
    Translation: 外面很冷。
  - Phrase: Trae un paraguas.
    Translation: 带上雨伞。
  - Phrase: ¿Cuál es la temperatura?
    Translation: 多少度？
  - Phrase: Está nevando.
    Translation: 下雪了。
  - Phrase: Hoy hace calorcito.
    Translation: 今天很暖和。
  - Phrase: Hace viento.
    Translation: 刮风了。

