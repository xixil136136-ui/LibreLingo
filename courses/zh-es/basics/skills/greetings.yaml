Phrases:
  - Phrase: ¡Hola! ¿Cómo estás?
    Translation: 你好！你好吗？
  - Phrase: Buenos días, gracias.
    Translation: 早上好，谢谢。
  - Phrase: Adiós, hasta luego.
    Translation: 再见，回头见。
  - Phrase: Muchas gracias.
    Translation: 非常感谢。
  - Phrase: Perdón, ¿dónde está el baño?
    Translation: 对不起，洗手间在哪里？

