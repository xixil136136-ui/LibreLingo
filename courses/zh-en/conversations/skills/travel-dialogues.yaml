Phrases:
  - Phrase: Where is the airport?
    Translation: 机场在哪里？
  - Phrase: I need a ticket to Berlin.
    Translation: 我需要一张去柏林的票。
  - Phrase: One-way or round trip?
    Translation: 单程还是往返？
  - Phrase: Which platform does the train leave from?
    Translation: 火车从哪个站台出发？
  - Phrase: What time is the next bus?
    Translation: 下一班车几点？
  - Phrase: Is this seat taken?
    Translation: 这个座位有人吗？
  - Phrase: Can I see your passport, please?
    Translation: 请出示您的护照。
  - Phrase: I have nothing to declare.
    Translation: 我没有需要申报的物品。
  - Phrase: How long is the journey?
    Translation: 旅途有多久？
  - Phrase: Please let me off at the next stop.
    Translation: 请在下一站让我下车。

