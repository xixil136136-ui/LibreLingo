New words:
  - Word: こんにちは
    Translation: 你好
  - Word: さようなら
    Translation: 再见
  - Word: おはようございます
    Translation: 早上好
  - Word: こんばんは
    Translation: 晚上好
  - Word: ありがとう
    Translation: 谢谢
  - Word: すみません
    Translation: 对不起/不好意思
  - Word: はい
    Translation: 是的
  - Word: いいえ
    Translation: 不是
  - Word: お願いします
    Translation: 请
  - Word: 大丈夫
    Translation: 没关系

Phrases:
  - Phrase: こんにちは、元気ですか？
    Translation: 你好，你好吗？
  - Phrase: ありがとうございます。
    Translation: 非常感谢。
  - Phrase: すみません、ちょっと待ってください。
    Translation: 对不起，请稍等。
  - Phrase: おはようございます、先生。
    Translation: 早上好，老师。
  - Phrase: さようなら、また会いましょう。
    Translation: 再见，后会有期。

Mini-dictionary:
  Japanese:
    - おはようございます: 早上好
    - ありがとう: 谢谢
    - こんばんは: 晚上好
    - お願いします: 请
    - はい: 是的
    - 大丈夫: 没关系
    - さようなら: 再见
    - いいえ: 不是
    - こんにちは: 你好
    - すみません: 对不起/不好意思
  Chinese:
    - 早上好: おはようございます
    - 对不起/不好意思: すみません
    - 没关系: 大丈夫
    - 请: お願いします
    - 再见: さようなら
    - 晚上好: こんばんは
    - 谢谢: ありがとう
    - 你好: こんにちは
    - 是的: はい
    - 不是: いいえ
