  Special characters:


New words:
  - Word: Сколько
    Translation: 多少钱
  - Word: скидка
    Translation: 折扣
  - Word: кредитная карта
    Translation: 信用卡
  - Word: наличные
    Translation: 现金
  - Word: размер
    Translation: 尺寸
  - Word: цвет
    Translation: 颜色
  - Word: примерить
    Translation: 试穿
  - Word: чек
    Translation: 收据
  - Word: слишком дорого
    Translation: 太贵
  - Word: обменять
    Translation: 换货

Phrases:
  - Phrase: Сколько это стоит?
    Translation: 这个多少钱？
  - Phrase: Можно примерить?
    Translation: 我能试穿这个吗？
  - Phrase: У вас есть другого цвета?
    Translation: 有别的颜色吗？
  - Phrase: Слишком дорого. Есть скидка?
    Translation: 太贵了。有折扣吗？
  - Phrase: Я беру. Можно оплатить картой?
    Translation: 我买了。能用卡支付吗？
  - Phrase: Чек, пожалуйста.
    Translation: 请给我收据。
  - Phrase: Я хотел бы обменять это.
    Translation: 我想换这个。
  - Phrase: У вас есть меньший размер?
    Translation: 有小一点的尺寸吗？
  - Phrase: Есть распродажа?
    Translation: 有打折活动吗？
  - Phrase: Я просто смотрю, спасибо.
    Translation: 我就看看，谢谢。

