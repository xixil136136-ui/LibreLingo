Phrases:
  - Phrase: У меня есть бронирование.
    Translation: 我有预订。
  - Phrase: Я хотел бы заселиться.
    Translation: 我想办理入住。
  - Phrase: Сколько стоит двухместный номер за ночь?
    Translation: 双人间一晚多少钱？
  - Phrase: Завтрак включён?
    Translation: 包含早餐吗？
  - Phrase: Какой пароль от WiFi?
    Translation: WiFi密码是什么？
  - Phrase: Кондиционер не работает.
    Translation: 空调坏了。
  - Phrase: Можно заказать пробуждение в 7 утра?
    Translation: 能给我设置早上7点的叫醒服务吗？
  - Phrase: Я хотел бы выехать.
    Translation: 我想退房。
  - Phrase: Можно оставить багаж здесь?
    Translation: 我能寄存行李吗？
  - Phrase: Спасибо за прекрасное пребывание!
    Translation: 谢谢，住得很愉快！

