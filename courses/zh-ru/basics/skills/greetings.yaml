New words:
  - Word: Здравствуйте
    Translation: 你好（正式）
  - Word: Привет
    Translation: 你好（非正式）
  - Word: До свидания
    Translation: 再见
  - Word: Спасибо
    Translation: 谢谢
  - Word: Пожалуйста
    Translation: 请/不客气
  - Word: Извините
    Translation: 对不起
  - Word: Да
    Translation: 是的
  - Word: Нет
    Translation: 不是
  - Word: Как дела?
    Translation: 你好吗
  - Word: Хорошо
    Translation: 很好

Phrases:
  - Phrase: Здравствуйте! Как дела?
    Translation: 你好！你好吗？
  - Phrase: Доброе утро, спасибо.
    Translation: 早上好，谢谢。
  - Phrase: До свидания, до встречи.
    Translation: 再见，回头见。
  - Phrase: Большое спасибо!
    Translation: 非常感谢！
  - Phrase: Извините, где туалет?
    Translation: 对不起，洗手间在哪里？

