Phrases:
  - Phrase: Поверните налево здесь.
    Translation: 在这里左转。
  - Phrase: Идите прямо.
    Translation: 一直往前走。
  - Phrase: Где находится вокзал?
    Translation: 车站在哪里？
  - Phrase: Это далеко отсюда?
    Translation: 离这里远吗？
  - Phrase: Мне нужна карта.
    Translation: 我需要一张地图。

