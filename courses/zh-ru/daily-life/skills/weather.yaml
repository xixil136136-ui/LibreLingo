Phrases:
  - Phrase: Сегодня солнечно.
    Translation: 今天天气晴朗。
  - Phrase: Будет дождь.
    Translation: 要下雨了。
  - Phrase: На улице очень холодно.
    Translation: 外面很冷。
  - Phrase: Возьмите зонтик.
    Translation: 带上雨伞。
  - Phrase: Какая температура?
    Translation: 多少度？
  - Phrase: Идёт снег.
    Translation: 下雪了。
  - Phrase: Сегодня тепло.
    Translation: 今天很暖和。
  - Phrase: Ветрено.
    Translation: 刮风了。

