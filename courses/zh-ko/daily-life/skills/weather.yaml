New words:
  - Word: 맑음
    Translation: 晴天
  - Word: 비
    Translation: 雨
  - Word: 눈
    Translation: 雪
  - Word: 바람
    Translation: 风
  - Word: 구름
    Translation: 云
  - Word: 춥다
    Translation: 冷
  - Word: 덥다
    Translation: 热
  - Word: 따뜻하다
    Translation: 温暖
  - Word: 기온
    Translation: 温度
  - Word: 우산
    Translation: 雨伞

Phrases:
  - Phrase: 오늘 날씨가 맑아요.
    Translation: 今天天气晴朗。
  - Phrase: 비가 올 거예요.
    Translation: 要下雨了。
  - Phrase: 밖이 아주 추워요.
    Translation: 外面很冷。
  - Phrase: 우산 가져가세요.
    Translation: 带上雨伞。
  - Phrase: 기온이 몇 도예요?
    Translation: 多少度？
  - Phrase: 눈이 와요.
    Translation: 下雪了。
  - Phrase: 오늘 따뜻해요.
    Translation: 今天很暖和。
  - Phrase: 바람이 불어요.
    Translation: 刮风了。

