Phrases:
  - Phrase: 제 어머니예요.
    Translation: 这是我的妈妈。
  - Phrase: 아버지가 키가 크세요.
    Translation: 我的爸爸很高。
  - Phrase: 여자 형제가 있어요.
    Translation: 我有一个姐妹。
  - Phrase: 남자 형제가 젊어요.
    Translation: 我的兄弟很年轻。
  - Phrase: 그녀는 제 친구예요.
    Translation: 她是我的朋友。
  - Phrase: 아이가 행복해요.
    Translation: 孩子很高兴。
  - Phrase: 제 아내는 친절해요.
    Translation: 我的妻子很善良。

