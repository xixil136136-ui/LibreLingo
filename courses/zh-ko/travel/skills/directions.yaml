New words:
  - Word: 왼쪽
    Translation: 左边
  - Word: 오른쪽
    Translation: 右边
  - Word: 직진
    Translation: 直走
  - Word: 여기
    Translation: 这里
  - Word: 거기
    Translation: 那里
  - Word: 가까이
    Translation: 附近
  - Word: 멀다
    Translation: 远
  - Word: 지도
    Translation: 地图
  - Word: 거리
    Translation: 街道
  - Word: 길
    Translation: 路

Phrases:
  - Phrase: 여기서 왼쪽으로 도세요.
    Translation: 在这里左转。
  - Phrase: 직진하세요.
    Translation: 一直往前走。
  - Phrase: 역이 어디예요?
    Translation: 车站在哪里？
  - Phrase: 여기서 멀어요?
    Translation: 离这里远吗？
  - Phrase: 지도가 필요해요.
    Translation: 我需要一张地图。

