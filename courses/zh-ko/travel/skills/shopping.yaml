New words:
  - Word: 가게
    Translation: 商店
  - Word: 가격
    Translation: 价格
  - Word: 비싸다
    Translation: 贵的
  - Word: 싸다
    Translation: 便宜的
  - Word: 돈
    Translation: 钱
  - Word: 품질
    Translation: 质量
