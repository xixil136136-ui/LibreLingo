Phrases:
  - Phrase: 이거 얼마예요?
    Translation: 这个多少钱？
  - Phrase: 너무 비싸요.
    Translation: 太贵了。
  - Phrase: 이건 품질이 좋아요.
    Translation: 这个质量很好。
  - Phrase: 가게 영업 중이에요?
    Translation: 商店开门吗？
  - Phrase: 오늘 문 닫았어요.
    Translation: 今天关门了。
  - Phrase: 이거 반품할 수 있어요?
    Translation: 能退货吗？
  - Phrase: 가게는 저기 있어요.
    Translation: 商店在那里。
  - Phrase: 돈이 없어요.
    Translation: 我没钱。

