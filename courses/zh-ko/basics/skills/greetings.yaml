Phrases:
  - Phrase: 안녕하세요, 반갑습니다.
    Translation: 你好，很高兴认识你。
  - Phrase: 감사합니다, 선생님.
    Translation: 谢谢您，老师。
  - Phrase: 죄송합니다, 늦었습니다.
    Translation: 对不起，我迟到了。
  - Phrase: 네, 괜찮습니다.
    Translation: 是的，没关系。
  - Phrase: 안녕히 계세요, 또 만나요.
    Translation: 再见，下次见。

