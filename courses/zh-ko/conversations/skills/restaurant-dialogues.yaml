Phrases:
  - Phrase: I'd like to make a reservation.
    Translation: 我想预约。
  - Phrase: A table for two, please.
    Translation: 请给我一个两人桌。
  - Phrase: Can I see the menu?
    Translation: 我能看看菜单吗？
  - Phrase: What do you recommend?
    Translation: 你推荐什么？
  - Phrase: I'll have the steak, please.
    Translation: 我要牛排。
  - Phrase: Could I have the bill, please?
    Translation: 请给我账单。
  - Phrase: The food is delicious!
    Translation: 食物太好吃了！
  - Phrase: Can I have some water?
    Translation: 能给我一些水吗？
  - Phrase: Is service charge included?
    Translation: 服务费包含在内吗？
  - Phrase: I'm allergic to peanuts.
    Translation: 我对花生过敏。

