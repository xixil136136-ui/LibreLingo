Phrases:
  - Phrase: Vorrei fare una prenotazione.
    Translation: 我想预约。
  - Phrase: Un tavolo per due, per favore.
    Translation: 请给我一个两人桌。
  - Phrase: Posso vedere il menu?
    Translation: 我能看看菜单吗？
  - Phrase: Cosa consiglia?
    Translation: 你推荐什么？
  - Phrase: Prendo la bistecca, per favore.
    Translation: 我要牛排。
  - Phrase: Posso avere il conto, per favore?
    Translation: 请给我账单。
  - Phrase: Il cibo è delizioso!
    Translation: 食物太好吃了！
  - Phrase: Posso avere un po' d'acqua?
    Translation: 能给我一些水吗？
  - Phrase: Il servizio è incluso?
    Translation: 服务费包含在内吗？
  - Phrase: Sono allergico alle arachidi.
    Translation: 我对花生过敏。

