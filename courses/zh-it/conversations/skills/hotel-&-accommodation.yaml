Phrases:
  - Phrase: Ho una prenotazione.
    Translation: 我有预订。
  - Phrase: Vorrei fare il check-in, per favore.
    Translation: 我想办理入住。
  - Phrase: Quanto costa una camera doppia a notte?
    Translation: 双人间一晚多少钱？
  - Phrase: La colazione è inclusa?
    Translation: 包含早餐吗？
  - Phrase: Qual è la password del WiFi?
    Translation: WiFi密码是什么？
  - Phrase: L'aria condizionata non funziona.
    Translation: 空调坏了。
  - Phrase: Posso avere una sveglia alle 7?
    Translation: 能给我设置早上7点的叫醒服务吗？
  - Phrase: Vorrei fare il check-out, per favore.
    Translation: 我想退房。
  - Phrase: Posso lasciare il bagaglio qui?
    Translation: 我能寄存行李吗？
  - Phrase: Grazie per un soggiorno meraviglioso!
    Translation: 谢谢，住得很愉快！

