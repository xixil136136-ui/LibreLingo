New words:
  - Word: Quanto
    Translation: 多少钱
  - Word: lo sconto
    Translation: 折扣
  - Word: la carta di credito
    Translation: 信用卡
  - Word: il contante
    Translation: 现金
  - Word: la taglia
    Translation: 尺寸
  - Word: il colore
    Translation: 颜色
  - Word: provare
    Translation: 试穿
  - Word: lo scontrino
    Translation: 收据
  - Word: troppo caro
    Translation: 太贵
  - Word: cambiare
    Translation: 换货

Phrases:
  - Phrase: Quanto costa questo?
    Translation: 这个多少钱？
  - Phrase: Posso provarlo?
    Translation: 我能试穿这个吗？
  - Phrase: Ce l'ha in un altro colore?
    Translation: 有别的颜色吗？
  - Phrase: È troppo caro. C'è uno sconto?
    Translation: 太贵了。有折扣吗？
  - Phrase: Lo prendo. Posso pagare con la carta?
    Translation: 我买了。能用卡支付吗？
  - Phrase: Lo scontrino, per favore.
    Translation: 请给我收据。
  - Phrase: Vorrei cambiare questo.
    Translation: 我想换这个。
  - Phrase: Ha una taglia più piccola?
    Translation: 有小一点的尺寸吗？
  - Phrase: Ci sono i saldi?
    Translation: 有打折活动吗？
  - Phrase: Sto solo guardando, grazie.
    Translation: 我就看看，谢谢。

