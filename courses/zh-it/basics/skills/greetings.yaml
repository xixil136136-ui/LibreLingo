New words:
  - Word: ciao
    Translation: 你好/再见
  - Word: buongiorno
    Translation: 早上好
  - Word: buonasera
    Translation: 晚上好
  - Word: grazie
    Translation: 谢谢
  - Word: per favore
    Translation: 请
  - Word: scusa
    Translation: 对不起
  - Word: sì
    Translation: 是的
  - Word: no
    Translation: 不是
  - Word: prego
    Translation: 不客气
  - Word: arrivederci
    Translation: 再见（正式）

Phrases:
  - Phrase: Ciao! Come stai?
    Translation: 你好！你好吗？
  - Phrase: Buongiorno, grazie.
    Translation: 早上好，谢谢。
  - Phrase: Arrivederci, a presto.
    Translation: 再见，回头见。
  - Phrase: Mille grazie!
    Translation: 非常感谢！
  - Phrase: Scusa, dov'è il bagno?
    Translation: 对不起，洗手间在哪里？

