Phrases:
  - Phrase: Oggi c'è sole.
    Translation: 今天天气晴朗。
  - Phrase: Pioverà.
    Translation: 要下雨了。
  - Phrase: Fa molto freddo fuori.
    Translation: 外面很冷。
  - Phrase: Porta un ombrello.
    Translation: 带上雨伞。
  - Phrase: Qual è la temperatura?
    Translation: 多少度？
  - Phrase: Nevica.
    Translation: 下雪了。
  - Phrase: Oggi fa tiepido.
    Translation: 今天很暖和。
  - Phrase: C'è vento.
    Translation: 刮风了。

