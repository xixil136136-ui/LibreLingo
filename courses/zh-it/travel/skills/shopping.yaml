Phrases:
  - Phrase: Quanto costa questo?
    Translation: 这个多少钱？
  - Phrase: È troppo caro.
    Translation: 太贵了。
  - Phrase: Questa è buona qualità.
    Translation: 这个质量很好。
  - Phrase: Il negozio è aperto?
    Translation: 商店开门吗？
  - Phrase: Oggi è chiuso.
    Translation: 今天关门了。
  - Phrase: Posso rendere questo?
    Translation: 能退货吗？
  - Phrase: Il negozio è laggiù.
    Translation: 商店在那里。
  - Phrase: Non ho soldi.
    Translation: 我没钱。

