New words:
  - Word: แม่
    Translation: 母亲
  - Word: พ่อ
    Translation: 父亲
  - Word: พี่สาว/น้องสาว
    Translation: 姐妹
  - Word: พี่ชาย/น้องชาย
    Translation: 兄弟
  - Word: ลูกสาว
    Translation: 女儿
  - Word: ลูกชาย
    Translation: 儿子
  - Word: ภรรยา
    Translation: 妻子
  - Word: สามี
    Translation: 丈夫
  - Word: เพื่อน
    Translation: 朋友
  - Word: เด็ก
    Translation: 孩子

Phrases:
  - Phrase: นี่คือแม่ของฉัน
    Translation: 这是我的妈妈。
  - Phrase: พ่อของฉันตัวสูง
    Translation: 我的爸爸很高。
  - Phrase: ฉันมีพี่สาว/น้องสาว
    Translation: 我有一个姐妹。
  - Phrase: พี่ชาย/น้องชายของฉันอายุน้อย
    Translation: 我的兄弟很年轻。
  - Phrase: เธอเป็นเพื่อนของฉัน
    Translation: 她是我的朋友。
  - Phrase: เด็กมีความสุข
    Translation: 孩子很高兴。
  - Phrase: ภรรยาของฉันใจดี
    Translation: 我的妻子很善良。

