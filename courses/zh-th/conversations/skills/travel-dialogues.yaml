New words:
  - Word: สนามบิน
    Translation: 机场
  - Word: ตั๋ว
    Translation: 票
  - Word: ชานชาลา
    Translation: 站台
  - Word: ออกเดินทาง
    Translation: 出发
  - Word: ถึง
    Translation: 到达
  - Word: เที่ยวเดียว
    Translation: 单程
  - Word: ไป-กลับ
    Translation: 往返
  - Word: พาสปอร์ต
    Translation: 护照
  - Word: วีซ่า
    Translation: 签证
  - Word: ศุลกากร
    Translation: 海关

Phrases:
  - Phrase: สนามบินอยู่ที่ไหน
    Translation: 机场在哪里？
  - Phrase: I need a ticket to Berlin.
    Translation: 我需要一张去柏林的票。
  - Phrase: เที่ยวเดียวหรือไปกลับ
    Translation: 单程还是往返？
  - Phrase: รถไฟออกจากชานชาลาไหน
    Translation: 火车从哪个站台出发？
  - Phrase: รถเที่ยวหน้าไปกี่โมง
    Translation: 下一班车几点？
  - Phrase: ที่นั่งนี้มีคนหรือยัง
    Translation: 这个座位有人吗？
  - Phrase: ขอดูพาสปอร์ตด้วยครับ
    Translation: 请出示您的护照。
  - Phrase: ฉันไม่มีของต้องแจ้งศุลกากร
    Translation: 我没有需要申报的物品。
  - Phrase: เดินทางนานแค่ไหน
    Translation: 旅途有多久？
  - Phrase: ลงป้ายหน้าด้วยครับ
    Translation: 请在下一站让我下车。

