Phrases:
  - Phrase: ฉันต้องการจองโต๊ะ
    Translation: 我想预约。
  - Phrase: โต๊ะสำหรับสองคนครับ
    Translation: 请给我一个两人桌。
  - Phrase: ขอดูเมนูหน่อยได้ไหม
    Translation: 我能看看菜单吗？
  - Phrase: คุณแนะนำอะไร
    Translation: 你推荐什么？
  - Phrase: ฉันขอสเต็ก
    Translation: 我要牛排。
  - Phrase: เช็คบิลด้วยครับ
    Translation: 请给我账单。
  - Phrase: อาหารอร่อยมาก
    Translation: 食物太好吃了！
  - Phrase: ขอน้ำหน่อยได้ไหม
    Translation: 能给我一些水吗？
  - Phrase: รวมค่าบริการหรือยัง
    Translation: 服务费包含在内吗？
  - Phrase: ฉันแพ้ถั่วลิสง
    Translation: 我对花生过敏。

