    Translation: 账单
  - Word: อร่อย
    Translation: 美味
  - Word: คำแนะนำ
    Translation: 推荐
  - Word: การจอง
    Translation: 预约
  - Word: พนักงานเสิร์ฟ
    Translation: 服务员
  - Word: โต๊ะสำหรับสองคน
    Translation: 两人桌
  - Word: เมนูพิเศษวันนี้
